name: nova-bella

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      POSTGRES_DB: nova_bella
      POSTGRES_USER: nova_bella
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - nova_bella_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova_bella -d nova_bella"]
      interval: 30s
      timeout: 5s
      retries: 12

  api:
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nova_bella_app:${APP_DATABASE_PASSWORD:?Ejecuta python -m scripts.configure_local_database}@postgres:5432/nova_bella
      INITIALIZE_SCHEMA: "false"
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Configura ADMIN_EMAIL en .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Configura ADMIN_PASSWORD_HASH en .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,https://nova-bella-boutique-2026.keenorbit34.chatgpt.site,https://nova-bella-centro-control-2026.keenorbit34.chatgpt.site}
      TOKEN_MINUTES: 30
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      start_period: 10s
      timeout: 5s
      retries: 5

volumes:
  nova_bella_postgres:
